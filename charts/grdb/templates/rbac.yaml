{{- if .Values.rbac.create }}
# Least-privilege RBAC for the platform's ServiceAccount. Every rule
# below is commented with the exact feature it serves — there is no rule
# here for a capability nothing the platform actually calls.
#
# Namespaces, Secrets, the six database-operator custom resources, and
# the workload-status resources (statefulsets, pods) are all necessarily
# cluster-scoped grants even though every real object lives in a Tenant
# namespace: Tenant namespaces are created dynamically by the platform
# itself and are not known at RBAC-authoring time, so a namespaced Role
# naming them in advance is not possible. This is the standard shape for
# a namespace-per-tenant controller (cert-manager, external-dns, etc. all
# do the same for their own dynamic-namespace resources).
#
# Server-Side Apply needs "create" (first apply of a not-yet-existing
# object) and "patch" (every apply after — SSA is always sent as a PATCH;
# "create" authorizes the case where that PATCH would create the object)
# — never "update".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "grdb.fullname" . }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
rules:
  # Tenant namespace reserve/release: check pre-existing ownership before
  # applying (get), Server-Side Apply the Namespace itself (create+patch),
  # remove it on Tenant delete (delete).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]

  # Connection Secret reads (SecretReader.Get — get); platform-issued
  # credentials for engines whose operator issues none: Instance create
  # Server-Side Applies a Secret under the platform's own field manager
  # before the CR references it (create+patch), Instance delete removes
  # it (delete). Every reference is always by exact namespace/name — no
  # "list"/"watch" is ever needed on Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]

  # Companion Service: when both external exposure modes are enabled at
  # once on a redis Instance, the operator's own single-Service CRD
  # field has no room for the second, so the platform applies a plain
  # core v1 Service itself ("<instance>-public"). Instance
  # create/UpdateExposure Server-Side Applies it (create+patch), and
  # UpdateExposure deletes it when that mode is turned back off
  # (delete). No get/list/watch: nothing ever reads a companion Service
  # back — its name is recomputed deterministically from the Instance.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "patch", "delete"]

  # MetricsNetworkPolicy (ticket #110): a plain networking.k8s.io/v1
  # NetworkPolicy, additive alongside whatever NetworkPolicy the
  # operator itself generates (dragonfly's own spec.networkPolicyEnabled) —
  # applied at Instance create (create+patch) to allow Prometheus
  # ingress to the metrics admin port, removed at Instance delete
  # (delete). Found live on ddb-eks: every dragonfly Instance create
  # returned 502 with no rule for this resource at all.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "patch", "delete"]

  # Storage reclaim on Instance delete: some operators (e.g. MongoDB's
  # PSMDB, dragonfly-operator) retain their PersistentVolumeClaims by
  # design, so the platform deletes the retained ones itself, or the
  # underlying volume bills forever with nothing naming it. Retained
  # claim names carry the operator's own InstanceIdentity labels (list)
  # and are then removed by name (delete) — no get (the reclaimer never
  # reads a claim's contents) and no create/patch (the platform never
  # makes a volume, only the operator does).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["list", "delete"]

  # redis Backup/Restore's redis-backup ServiceAccount, applied into
  # every Tenant namespace (NamespaceReserver.Reserve, ADR-0018), and
  # dragonfly S3 snapshot's per-Instance dragonfly-<name> ServiceAccount
  # (ADR-0019) — both created/annotated by the platform itself
  # (create+patch). delete is real too: Instance delete's own teardown
  # (deleteInstanceCluster, BackupServiceAccountProvider branch)
  # explicitly removes a dragonfly Instance's ServiceAccount by name —
  # found live on ddb-eks, where create+patch alone left every dragonfly
  # delete failing 500 on a 403 from this exact call. redis-backup's own
  # ServiceAccount is never deleted by this platform (it outlives the
  # namespace), but the grant is a single verbs list for the resource,
  # not per-caller.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "patch", "delete"]

  # redis Backup/Restore's own orchestration (ADR-0018): plain batch/v1
  # Jobs running the platform's redis-backup/redis-restore images.
  # BackupUsecase.Create/Delete Server-Side Apply a Job (create+patch)
  # through the same ClusterApplier every Engine Adapter uses, and lazy
  # status finalize (List/Get) reads a terminal Job's own state back.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch"]

  # Postgres Engine Adapter: the CloudNativePG operator's Cluster custom
  # resource. Instance create/update Server-Side Applies it
  # (create+patch), the status source watches it cluster-wide for
  # Ready/Provisioning/Degraded (list+watch), and Instance delete removes
  # it (delete).
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # Postgres Engine Adapter's Pooler (CONTEXT.md "Pooler", issue #112):
  # CloudNativePG's own Pooler custom resource, registered as postgres's
  # CompanionGVR (catalog.go) — its status is watched cluster-wide
  # exactly like Clusters above (list+watch), and Instance
  # create/UpdateNetworks/UpdatePooler Server-Side Apply it
  # (create+patch) and remove it when disabled or the Instance is
  # deleted (delete).
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["poolers"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # postgres Engine Adapter's continuous backup (issue #116, #120,
  # ADR-0020): the Barman Cloud Plugin's ObjectStore (one per Tenant,
  # Server-Side Applied lazily on that Tenant's first backup-enabled
  # Instance, never deleted — create+patch, no get/list/watch needed
  # since it is referenced by name, never read back), the on-demand
  # Backup custom resource ("Backup now" applies one; live history
  # lists every Backup by cluster label — get+list+watch+create+patch),
  # and the ScheduledBackup custom resource (day-2 cron+suspend
  # sub-resource, applied like Networks — create+patch, never deleted,
  # suspend:true instead). Found live on ddb-eks: the platform's own
  # watch pipeline for Backups failed to sync with no rule for this
  # resource at all, and a postgres Instance create with backup enabled
  # would fail identically applying its Tenant's ObjectStore.
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "create", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["scheduledbackups"]
    verbs: ["get", "create", "patch"]

  # ClickHouse Engine Adapter's backup Job (issue #140, ADR-0025): the
  # per-Instance namespace-scoped Role/RoleBinding the platform applies
  # so its own backup Job's ServiceAccount can list the Instance's own
  # shard-0 replica Pods live at run time (create+patch+delete — same
  # apply/teardown shape as every other companion object above). The
  # grdb-platform ClusterRole's own pre-existing pods get/list/watch
  # rule above already covers what these Roles themselves grant, so
  # this is not a privilege escalation. Found live on ddb-eks: every
  # clickhouse Instance create returned 502 with no rule for this
  # resource at all.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "patch", "delete"]

  # MongoDB Engine Adapter: the Percona Server for MongoDB operator's
  # PerconaServerMongoDB custom resource. Same shape as postgres's rule
  # above.
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # MongoDB Engine Adapter's native backup/restore (issue #144,
  # ADR-0029): the Percona operator's own PerconaServerMongoDBBackup
  # (Create/List/Get/Delete — a real entity a Tenant lists many of,
  # never routed through OperationCatalog) and
  # PerconaServerMongoDBRestore (create+patch only, create-time-only
  # like every other Engine's own Restore) custom resources.
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbbackups"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["psmdb.percona.com"]
    resources: ["perconaservermongodbrestores"]
    verbs: ["create", "patch"]

  # ClickHouse Engine Adapter: the Altinity operator's
  # ClickHouseInstallation custom resource.
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["clickhouseinstallations"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # ClickHouse Engine Adapter's per-Tenant Keeper ensemble (ADR-0023):
  # the Altinity operator's own ClickHouseKeeperInstallation custom
  # resource, Server-Side Applied lazily once per Tenant (create+patch,
  # never deleted, never read back — referenced by deterministic name).
  - apiGroups: ["clickhouse-keeper.altinity.com"]
    resources: ["clickhousekeeperinstallations"]
    verbs: ["create", "patch"]

  # Elasticsearch Engine Adapter: the ECK operator's Elasticsearch custom
  # resource.
  - apiGroups: ["elasticsearch.k8s.elastic.co"]
    resources: ["elasticsearches"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # Redis Engine Adapter's standalone topology: the OT-Container-Kit
  # operator's Redis custom resource. Its status source reads the owned
  # StatefulSet instead of this CR (see the apps/statefulsets rule
  # below), so no list/watch — but Operations' "update-configuration"
  # reads the CR first to upsert into spec.redisConfig.dynamicConfig
  # without dropping a key a prior call set, so get is real here.
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redis"]
    verbs: ["get", "create", "patch", "delete"]

  # Redis Engine Adapter's Replication topology, and Sentinel
  # topology's own primary CR (sentinel shares replication's GVR/BuildCR
  # — same shape) — get for the same update-configuration read-merge-
  # write as the standalone CR above.
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redisreplications"]
    verbs: ["get", "create", "patch", "delete"]

  # Sentinel topology's own companion CR: applied/deleted alongside the
  # primary RedisReplication above, and read back for the companion's
  # own reported state — unlike the primary CR, RedisSentinel does
  # carry meaningful status (get+list+watch).
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redissentinels"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # Redis Engine Adapter's Cluster topology: unlike every other redis
  # topology above, the RedisCluster CR itself carries
  # readyLeaderReplicas/readyFollowerReplicas/phase, so this needs
  # get+list+watch exactly like the other CR-based status rules above.
  - apiGroups: ["redis.redis.opstreelabs.in"]
    resources: ["redisclusters"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]

  # Dragonfly Engine Adapter: the dragonfly-operator's Dragonfly custom
  # resource. Same status-from-StatefulSet shape as redis's rule above.
  - apiGroups: ["dragonflydb.io"]
    resources: ["dragonflies"]
    verbs: ["create", "patch", "delete"]

  # Workload-backed status: some operators (redis, dragonfly) publish no
  # meaningful CR status, so their StatusSource reads the StatefulSet
  # each operator owns instead. Cluster-wide list+watch informer, same
  # shape as the CR-based watches above.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]

  # The StatefulSet's own status has no per-pod detail — no field says
  # "this pod is crash-looping" — so the same workload-backed status
  # strategy also reads each owned Pod's containerStatuses for that, and
  # node-occupancy reporting reads Pods filtered per-Node to name which
  # Instance/Tenant sits on each machine.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Redis Engine Adapters' ServiceMonitor companion: applied only when
  # a ClusterCapabilities check confirms this CRD is registered, so
  # this rule is only ever exercised on a cluster running the
  # Prometheus Operator — never a hard requirement to boot, exactly
  # like the six database-operator CRD rules above being harmless when
  # their own CRD is absent.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors"]
    verbs: ["get", "create", "patch", "delete"]

  # redis-operator's own controller metrics PodMonitor: applied once
  # per operator install rather than per Instance, gated by the same
  # ClusterCapabilities check as servicemonitors above — never a hard
  # requirement to boot.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors"]
    verbs: ["get", "create", "patch", "delete"]

  # Nodes, cluster-wide: the platform's Compute Profile page lists the
  # machines provisioned for one profile. The grant is necessarily
  # cluster-wide because Kubernetes RBAC cannot scope a read by label and
  # autoscaler-launched node names are typically IP-derived and
  # ephemeral, so resourceNames cannot enumerate them either. What
  # actually keeps every read inside the platform's own capacity is the
  # label selector every List call carries, built from a Compute Profile
  # row the platform itself wrote — never from a value a caller supplies
  # raw.
  {{- if .Values.rbac.karpenterIntegration.enabled }}
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  {{- end }}

  {{- if .Values.rbac.argocdIntegration.enabled }}
  # Installing an operator Server-Side Applies an ArgoCD Application
  # under the platform's own field manager (create+patch) and reads its
  # sync/health status back by Engine id (get+list) — never "update":
  # SSA is always sent as PATCH, and the sync-trigger is a plain merge
  # patch, covered by the same verb.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "create", "patch"]
  {{- end }}

  {{- if .Values.rbac.karpenterIntegration.enabled }}
  # Karpenter NodePools: readiness lists them for the operator-install
  # picker (get+list, no watch — a plain per-request List) and Compute
  # Profile materializes/releases exactly one via Server-Side Apply under
  # the platform's own field manager (create+patch+delete).
  - apiGroups: ["karpenter.sh"]
    resources: ["nodepools"]
    verbs: ["get", "list", "create", "patch", "delete"]

  # EC2NodeClasses: read-only for both readiness's Karpenter-prerequisite
  # check (at least one must exist) and Compute Profile's node-class
  # reference validation — never created here; these belong to the
  # cluster's own platform team, exactly like the ArgoCD install itself.
  - apiGroups: ["karpenter.k8s.aws"]
    resources: ["ec2nodeclasses"]
    verbs: ["get", "list"]
  {{- end }}
---
# The one ConfigMap the platform ever reads before writing anything else:
# pinned by exact name via resourceNames, in its own namespaced Role
# rather than folded into the ClusterRole above — a cluster-wide "get
# configmaps" grant would be wildly broader than the single object
# ClusterGuard.Verify actually checks. See platformMarker in values.yaml
# and templates/marker-configmap.yaml for why this Role's namespace
# matters.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grdb.fullname" . }}-marker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["grdb-platform-marker"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grdb.fullname" . }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "grdb.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grdb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "grdb.fullname" . }}-marker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "grdb.fullname" . }}-marker
subjects:
  - kind: ServiceAccount
    name: {{ include "grdb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.argocdIntegration.enabled }}
---
# Readiness's ArgoCD-healthy check: argocd-server (the API/UI Deployment)
# and argocd-application-controller (the reconciler StatefulSet) by exact
# name — no argocd-repo-server read, no list, no access to any other
# object in the ArgoCD namespace (Applications are already covered by the
# ClusterRole above; this Role is deliberately scoped to only the two
# workloads readiness actually Gets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grdb.fullname" . }}-argocd-health
  namespace: {{ .Values.rbac.argocdIntegration.namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["argocd-server"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["argocd-application-controller"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "grdb.fullname" . }}-argocd-health
  namespace: {{ .Values.rbac.argocdIntegration.namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "grdb.fullname" . }}-argocd-health
subjects:
  - kind: ServiceAccount
    name: {{ include "grdb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if .Values.rbac.karpenterIntegration.enabled }}
---
# Readiness's Karpenter-healthy check: the karpenter controller
# Deployment by exact name. kube-system also hosts CNI/CSI/CoreDNS and
# other cluster-critical workloads this platform has no business reading,
# so this is a Role scoped to exactly one object, not a cluster-wide
# Deployment grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grdb.fullname" . }}-karpenter-health
  namespace: {{ .Values.rbac.karpenterIntegration.namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["karpenter"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "grdb.fullname" . }}-karpenter-health
  namespace: {{ .Values.rbac.karpenterIntegration.namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "grdb.fullname" . }}-karpenter-health
subjects:
  - kind: ServiceAccount
    name: {{ include "grdb.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
