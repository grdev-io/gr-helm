{{- if not .Values.existingSecret }}
# Credential-bearing configuration. BOOTSTRAP_SUPERADMIN_EMAIL is
# deliberately not secret content on its own (see config.Config's own
# doc comment: it bootstraps a login, it is not one), but it ships
# alongside its PASSWORD here rather than splitting the pair across the
# ConfigMap and this Secret, which could drift out of sync — Validate
# rejects exactly one of the pair being set, and applying one without
# the other would trip that.
#
# Prefer values.existingSecret over this template for anything beyond a
# quick-start install: bring your own Secret (sealed-secrets, External
# Secrets Operator, a plain `kubectl create secret generic`) carrying
# these same keys, and this template renders nothing at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grdb.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- if .Values.bootstrapSuperadmin.email }}
  BOOTSTRAP_SUPERADMIN_EMAIL: {{ .Values.bootstrapSuperadmin.email | quote }}
  BOOTSTRAP_SUPERADMIN_PASSWORD: {{ .Values.bootstrapSuperadmin.password | quote }}
  {{- end }}
  {{- if .Values.smtp.username }}
  SMTP_USERNAME: {{ .Values.smtp.username | quote }}
  {{- end }}
  {{- if .Values.smtp.password }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if .Values.smtp.customCACert }}
  SMTP_CUSTOM_CA_CERT: {{ .Values.smtp.customCACert | quote }}
  {{- end }}
  {{- if .Values.oauth.github.clientSecret }}
  GITHUB_CLIENT_SECRET: {{ .Values.oauth.github.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oauth.google.clientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.oauth.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.licensing.licenseActivationKey }}
  LICENSE_ACTIVATION_KEY: {{ .Values.licensing.licenseActivationKey | quote }}
  {{- end }}
{{- end }}
