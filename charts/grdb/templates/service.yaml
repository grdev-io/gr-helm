# ClusterIP: fronts the platform for Ingress (templates/ingress.yaml, if
# enabled) and `kubectl port-forward` — never external routing on its
# own.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "grdb.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
