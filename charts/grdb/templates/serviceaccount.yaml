{{- if .Values.serviceAccount.create }}
# The platform's own Kubernetes identity (see templates/rbac.yaml for
# what it is bound to). No cloud-provider workload identity is assumed —
# annotations here are how a customer opts in to IRSA/EKS Pod Identity/
# GKE Workload Identity/AKS Workload Identity for the AWS instance-type
# catalogue feature only; every other feature works with no cloud
# identity attached to this ServiceAccount at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grdb.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
