{{- if .Values.ingress.enabled }}
# Optional and generic: no ALB-specific (or any other controller-
# specific) annotation is baked in here — set ingress.className and
# ingress.annotations for whatever controller your cluster runs (nginx,
# Traefik, an AWS/GCP/Azure load-balancer controller, ...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "grdb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdb.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "grdb.fullname" . }}
                port:
                  name: http
{{- end }}
